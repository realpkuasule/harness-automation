name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: [self-hosted, Linux, X64, harness-release]
    environment: npm-release

    defaults:
      run:
        working-directory: mcp-server

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx vitest run --coverage

      - name: Build
        run: npm run build

      - name: Publish
        run: |
          if published_version="$(npm view "${npm_package_name}@${npm_package_version}" version --json 2>&1)"; then
            if [ "$published_version" = "\"${npm_package_version}\"" ]; then
              echo "${npm_package_name}@${npm_package_version} is already published; skipping duplicate publish."
              exit 0
            fi
            printf '%s\n' "$published_version" >&2
            exit 1
          fi

          if printf '%s\n' "$published_version" | grep -Eq 'E404|404 Not Found'; then
            npm publish --access public
          else
            printf '%s\n' "$published_version" >&2
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
