name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: >-
      ${{ fromJSON(
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        ) && '["self-hosted","Linux","X64","harness-ci"]' || '["ubuntu-latest"]'
      ) }}
    timeout-minutes: 30

    defaults:
      run:
        working-directory: mcp-server

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: ${{ runner.environment != 'self-hosted' && 'npm' || '' }}
          cache-dependency-path: mcp-server/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version: "1.22.x"
          cache: false

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npx vitest run --coverage --pool=threads --maxWorkers=1

      - name: Evaluation regression gate
        working-directory: .
        run: node evals/run_npm_release_policy.mjs
