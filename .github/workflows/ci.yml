name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            hosted_runner: '["ubuntu-latest"]'
            trusted_runner: '["self-hosted","Linux","X64","harness-ci"]'
          - platform: windows-x64
            hosted_runner: '["windows-latest"]'
            trusted_runner: '["self-hosted","Windows","X64","harness-ci"]'
    runs-on: >-
      ${{ fromJSON(
        (
          (
            github.event_name == 'push' &&
            github.ref == 'refs/heads/main' &&
            github.actor == github.repository_owner
          ) || (
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.user.login == github.repository_owner
          )
        ) && matrix.trusted_runner || matrix.hosted_runner
      ) }}

    defaults:
      run:
        working-directory: mcp-server

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: mcp-server/package-lock.json

      - name: Setup Go
        if: runner.os != 'Windows'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version: "1.22.x"
          cache: false

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        if: runner.os != 'Windows'
        run: npx vitest run --coverage

      - name: Test portable worktree governance on Windows
        if: runner.os == 'Windows'
        run: |
          npx vitest run src/worktree/service.test.ts --testTimeout=20000 -t "portable worktree inventory"
          npx vitest run src/worktree/service.test.ts --testTimeout=20000 -t "(separates portable policy|configures a parameterized|allocates only|derives container|reports isolated|blocks predicted|fails closed and retains|rejects nested|keeps legacy flat|moves one exactly|rejects migration hash|rejects legacy migration|keeps a durable|detects host-binding|delegates an allocation|fails closed for denied)"
          npx vitest run src/worktree/service.test.ts --testTimeout=20000 -t "(rechecks workspace|denies destructive|fails closed when enforced|requires an approved|configures, allocates|writes an applied|rebinds|renews|rejects missing|recovers a clean|rejects unsafe recovery|rejects lifecycle drift|fails closed while another|rejects unsafe allocation|queries the pending|requires configured-Project|rejects malformed)"
          npx vitest run src/worktree/service.test.ts --testTimeout=20000 -t "(plans and atomically|hash-binds dirty|streams large|never executes|retains legacy textconv|retains the v2.1.3|rejects index-only|fails closed on symlinked|rejects unsupported|rejects unsafe or ambiguous|rejects a branch)"
          npx vitest run src/worktree/service.test.ts --testTimeout=20000 -t "(compensates only|hash-binds and preserves|produces deterministic|creates no receipt|refuses adoption|retains failed close|rejects tampered|reuses the rollback|binds configured|observes the provider|applies and rolls back)"
          npx vitest run src/worktree/service.test.ts --testTimeout=20000 -t "temporary review and retention"

      - name: Build
        if: runner.os != 'Windows'
        run: npm run build
