name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash
        working-directory: mcp-server

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        if: runner.os != 'Windows'
        run: npx vitest run --coverage

      - name: Test portable worktree governance on Windows
        if: runner.os == 'Windows'
        run: |
          npx vitest run src/worktree/service.test.ts --testTimeout=20000 -t "portable worktree inventory|hash-approved worktree lifecycle"
          npx vitest run src/worktree/service.test.ts --testTimeout=20000 -t "hash-approved worktree adoption|temporary review and retention"

      - name: Build
        if: runner.os != 'Windows'
        run: npm run build
