          "kind": "agent-instruction",
          "adapter": "portable",
          "configPath": ".harness/generated/effective-policy.md"
        }
      ],
      "verification": {
        "commands": [],
        "passCriteria": "Review confirms that contract sources and consumers changed together."
      },
